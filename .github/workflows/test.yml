name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install python-hwpx numpy soundfile
      - name: Install ffmpeg and Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Lint SKILL.md front matter
        run: node tests/lint-skills.mjs
      - name: Run all skill tests
        env:
          PYTHON: python
        run: node tests/run.mjs
