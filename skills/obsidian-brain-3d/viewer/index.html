<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#02060b;--ink:#dcefff;--dim:#6f8da6;--line:rgba(110,200,255,.38);--cy:#7fd0ff}

.box:before,.box:after{content:'';position:absolute;width:11px;height:11px;border:1px solid var(--cy);pointer-events:none}
.box:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.box:after{right:-1px;bottom:-1px;border-left:0;border-top:0}

#card .h{background:var(--cy);color:#02101c;padding:4px 9px;font-weight:700;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#ring{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 14px #fff;pointer-events:none;z-index:4;animation:rg 1.6s infinite}
@keyframes rg{50%{transform:scale(1.3);opacity:.5}}

.pn canvas{display:block}

.rw .ti small{color:#6f8da6;font-size:9.5px;margin-left:4px}

<script>
/* ===== 템플릿 설정 ===== */
const CFG={
 regions:[
  {key:'frontal',col:'#ffb04d',center:[.62,.22,0],dir:[1,.35,.2]},
  {key:'parietal',col:'#4fd6ff',center:[-.1,.5,0],dir:[-.2,1,.2]},
  {key:'temporal',col:'#ff6f9a',center:[.2,-.22,.42],dir:[.4,-.6,1]},
  {key:'occipital',col:'#a98bff',center:[-.8,.12,0],dir:[-1,.2,.3]},
  {key:'cerebellum',col:'#52f0b0',center:[-.55,-.42,0],dir:[-.8,-.8,.7],tree:'뿌리 roots'},
  {key:'brainstem',col:'#ffe9a8',center:[-.07,-.6,0],dir:[0,-1,.3],tree:'줄기 trunk'}
 ],
 rotateSpeed:.09,
 jaw:false,           // 아래턱·이빨 표시 (얼굴처럼 보이지 않게 기본은 끔)
 skull:{scale:1.34,x:.1,y:-.22},  // 두개골 맞춤
 bloom:{strength:.6,radius:1.0},
 background:'net'     // net | hex | space | rain | contour | none   
};
/* ======================== */
const B=window.BRAIN,N=B.nodes,R=CFG.regions;
const codeOf=(s,i)=>{s=String(s||'').trim();if(!s||s==='-')return 'R'+(i+1);const w=s.replace(/\(.*\)/,'').trim()||s;return /^[\x00-\x7f]+$/.test(w)?w.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'R'+(i+1):w.slice(0,2)};
R.forEach((r,i)=>{const g=(B.regions||[])[i]||{name:'-'};r.ko=String(g.name).replace(/[<>&"]/g,'');r.code=codeOf(g.name,i)});
{const seen={};R.forEach(r=>{seen[r.code]=(seen[r.code]||0)+1});R.forEach((r,i)=>{if(seen[r.code]>1){const w=r.ko.replace(/[^A-Za-z0-9가-힣]/g,'');r.code=(w.slice(0,1)+w.slice(-1)).toUpperCase()||'R'+(i+1)}})}
CFG.recentFrom=B.stat.recentFrom||'';CFG.chartFrom=B.stat.chartFrom||'';
document.title=(B.stat.title||'Knowledge')+' · Brain 3D';
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const rnd=mul(1019);
const OKS=new Set((B.stat.okStatus||[]).map(s=>String(s).toLowerCase()));const isOK=n=>OKS.has(String(n[4]||'').toLowerCase());
const adj=N.map(()=>[]);B.edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});
const maxDate=N.reduce((m,n)=>n[5]>m?n[5]:m,'');
const days=[];for(let d=new Date(CFG.chartFrom);d.toISOString().slice(0,10)<=maxDate;d.setDate(d.getDate()+1))days.push(d.toISOString().slice(0,10));

/* ---------- 뇌·두개골 표면 ---------- */
const GD=[[.8,.5,.3,15,.3,1],[-.4,.9,.5,21,1.1,1],[.2,-.6,.9,27,2.3,1],[.9,.1,-.7,35,4,.7]];
const gnoise=(x,y,z)=>{let s=0;for(const d of GD)s+=d[5]*Math.sin((d[0]*x+d[1]*y+d[2]*z)*d[3]+d[4]);return s/3.7};
const sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
function softW(px,py,pz){const w=[0,0,0,0,0,0];let s=0;for(let i=0;i<4;i++){const c=R[i].center;const dz=(i===2?Math.abs(pz):pz)-c[2];w[i]=Math.exp(-((px-c[0])*(px-c[0])+(py-c[1])*(py-c[1])+dz*dz*.6)/.07);s+=w[i]}for(let i=0;i<4;i++)w[i]/=s;return w}
function fixSeams(g){const p=g.attributes.position,n=g.attributes.normal,m=new Map(),key=i=>Math.round(p.getX(i)*3000)+','+Math.round(p.getY(i)*3000)+','+Math.round(p.getZ(i)*3000);
 for(let i=0;i<p.count;i++){const k=key(i);let e=m.get(k);if(!e){e=[0,0,0];m.set(k,e)}e[0]+=n.getX(i);e[1]+=n.getY(i);e[2]+=n.getZ(i)}
 for(let i=0;i<p.count;i++){const e=m.get(key(i));const l=Math.hypot(e[0],e[1],e[2])||1;n.setXYZ(i,e[0]/l,e[1]/l,e[2]/l)}}
function buildPart(seg,xf,fixed){
 const geo=new THREE.SphereGeometry(1,seg[0],seg[1]);const P=geo.attributes.position,n=P.count;
 const wA=new Float32Array(n*3),wB=new Float32Array(n*3),gr=new Float32Array(n),reg=new Int8Array(n);const u=new THREE.Vector3();
 for(let i=0;i<n;i++){u.set(P.getX(i),P.getY(i),P.getZ(i));const r=xf(u);P.setXYZ(i,r.x,r.y,r.z);const w=fixed>=0?[0,0,0,0,0,0].map((_,k)=>k===fixed?1:0):(r.w||[0,0,0,0,0,0]);
  wA.set([w[0],w[1],w[2]],i*3);wB.set([w[3],w[4],w[5]],i*3);gr[i]=r.g;let bi=0;for(let k=1;k<6;k++)if(w[k]>w[bi])bi=k;reg[i]=bi}
 geo.setAttribute('wA',new THREE.BufferAttribute(wA,3));geo.setAttribute('wB',new THREE.BufferAttribute(wB,3));geo.setAttribute('groove',new THREE.BufferAttribute(gr,1));
 geo.computeVertexNormals();fixSeams(geo);return{geo,reg,count:n};
}
/* ---------- 실제 3D 모델 (NIH 3D, CC-BY) ---------- */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function dec(b64,T){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new T(u.buffer)}
function modelGeo(p,xf){const q=dec(p.pos,Int16Array);const n=q.length/3;const pos=new Float32Array(q.length);for(let i=0;i<n;i++){const v=xf([q[i*3]/32767,q[i*3+1]/32767,q[i*3+2]/32767]);pos[i*3]=v[0];pos[i*3+1]=v[1];pos[i*3+2]=v[2]}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));if(p.idx)geo.setIndex(new THREE.BufferAttribute(dec(p.idx,p.idx32?Uint32Array:Uint16Array),1));geo.computeVertexNormals();return geo}
// 뇌: 모델의 앞(-z)을 +x로, 위는 그대로
const brainParts=[];
MODELS.brain.parts.forEach(p=>{const geo=modelGeo(p,v=>[-v[2],v[1]+.04,v[0]]);const P=geo.attributes.position,n=P.count;
 const wA=new Float32Array(n*3),wB=new Float32Array(n*3),gr=new Float32Array(n),reg=new Int8Array(n);
 for(let i=0;i<n;i++){const x=P.getX(i),y=P.getY(i),z=P.getZ(i);let w;
  if(y<-.38&&Math.abs(z)<.14&&x>-.45&&x<.12)w=[0,0,0,0,0,1];else if(y<-.28&&x<-.18)w=[0,0,0,0,1,0];else w=softW(x,y,z);
  wA.set([w[0],w[1],w[2]],i*3);wB.set([w[3],w[4],w[5]],i*3);let bi=0;for(let k=1;k<6;k++)if(w[k]>w[bi])bi=k;reg[i]=bi}
 geo.setAttribute('wA',new THREE.BufferAttribute(wA,3));geo.setAttribute('wB',new THREE.BufferAttribute(wB,3));geo.setAttribute('groove',new THREE.BufferAttribute(gr,1));
 brainParts.push({geo,reg,count:n})});
// 두개골: 모델의 앞(-x)을 +x로 (180° 회전), 크기·위치는 CFG.skull
const SKJ=['Mandible','Lower teeth','Upper teeth'];
const skullParts=MODELS.skull.parts.filter(p=>CFG.jaw||!SKJ.includes(p.name)).map(p=>({name:p.name,geo:modelGeo(p,v=>[-v[0]*CFG.skull.scale+CFG.skull.x,v[1]*CFG.skull.scale+CFG.skull.y,-v[2]*CFG.skull.scale])}));
// 깊은 구조(뇌실·뇌량·시상)는 수식 그대로
function tubeGeo(pts,r,seg){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));return new THREE.TubeGeometry(c,seg||90,r,10,false)}
const ccGeo=tubeGeo([[-.62,.1,0],[-.4,.27,0],[0,.32,0],[.4,.27,0],[.64,.12,0]],.03,60);
const ventL=new THREE.SphereGeometry(1,40,28);ventL.scale(.3,.075,.06);const ventR=ventL.clone();ventL.translate(.05,.13,.09);ventR.translate(.05,.13,-.09);
const thal=new THREE.SphereGeometry(1,28,20);thal.scale(.1,.07,.1);thal.translate(-.05,.0,0);
// 노드 후보(뇌 표면 마루)
const cand=R.map(()=>[]);brainParts.forEach(pt=>{const G=pt.geo.attributes.groove;for(let i=0;i<pt.count;i++)if(G.getX(i)<.35)cand[pt.reg[i]].push([pt,i])});

/* ---------- three ---------- */
const cv=$('gl');const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
const PX=Math.min(devicePixelRatio,2);renderer.setPixelRatio(PX);renderer.setScissorTest(true);
const scene=new THREE.Scene(),root=new THREE.Group();scene.add(root);
const UA=R.map(()=>1);
const UNI={t:{value:0},px:{value:PX},uC:{value:R.map(r=>new THREE.Color(r.col))},uA:{value:UA.slice()},uMorph:{value:0},uSm:{value:0},uSc:{value:0},uSt:{value:.085},uSa:{value:new THREE.Vector3(0,1,0)},uK:{value:1}};
const SLAB='uniform float uSm,uSc,uSt,uMorph,t,px,uK;uniform vec3 uSa;float slabF(vec3 p){float inn=step(abs(dot(p,uSa)-uSc),uSt);return uSm<.5?1.:(uSm<1.5?1.+1.3*inn:mix(.035,1.,inn));}';
const ADD={transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending};
// X-ray 뼈/깊은 구조
function boneMat(col,str,rimPow,side){return new THREE.ShaderMaterial({...ADD,side:side||THREE.DoubleSide,uniforms:{...UNI,uCol:{value:new THREE.Color(col)},uStr:{value:str},uRP:{value:rimPow}},
 vertexShader:SLAB+'varying vec3 vN,vV;varying float vS;attribute float groove;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=-mv.xyz;vS=slabF(position);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform vec3 uCol;uniform float uStr,uRP,uMorph;varying vec3 vN,vV;varying float vS;void main(){float nv=abs(dot(normalize(vN),normalize(vV)));float f=pow(1.-nv,uRP);float th=.012/(nv+.2);float k=(f*1.1+th+.012)*uStr*vS*(1.-uMorph*.93);gl_FragColor=vec4(uCol*k*1.5,clamp(k,0.,1.));}'})}
const skullMat=boneMat(0xd6ecff,.5,2.2);
skullParts.forEach(p=>root.add(new THREE.Mesh(p.geo,skullMat)));
const deepMat=boneMat(0x6fb8ff,.7,1.8);[ventL,ventR,thal,ccGeo].forEach(g=>root.add(new THREE.Mesh(g,deepMat)));
// 뇌 (엑스레이 + 영역 빛)
const brainMat=new THREE.ShaderMaterial({...ADD,side:THREE.DoubleSide,uniforms:UNI,
